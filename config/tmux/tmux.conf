# ----------------------------------------------------------------------
# | General                                                            |
# ----------------------------------------------------------------------

# Changing prefix from 'Ctrl+b' to 'Ctrl+Space'
unbind C-b
set -g prefix C-space
bind Space send-prefix

# Create shortcut for reloading tmux
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display "Matrix Reloaded!"


# Splitting terminals, and open at the CWD
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"


# Mouse Mode Activate!
set -g mouse on

# Pane navigation via keyboard
setw -g mode-keys vi
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# # Basic color support setting
 set-option -g default-terminal "screen-256color"
# #set-option -sa temrinal-overides ",xterm*:Tc"
# # Active Pane
# set -g pane-active-border-style "fg=#5ccc96"
# # # Inactive Pane
# set -g pane-border-style "fg=#686f9a"
# # Active window
# set-option -g window-status-current-style bg='#686f9a',fg='#ffffff'
# # Message
# set-option -g message-style bg='#686f9a',fg='#ecf0c1'
# set-option -g message-command-style bg='#686f9a',fg='#ecf0c1'
# # When Commands are run
# set -g message-style "fg=#0f111b,bg=#686f9a"

# Enable pass-through for image rendering
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

set -as terminal-features ',xterm-kitty:clipboard:ccolour:cstyle:extkeys:focus:images:menu:meta:mouse:rect:sixel:title'

# Pop out windows
# Git 
bind C-y display-popup \
  -d "#{pane_current_path}" \
  -w 80% \
  -h 80% \
  -E "lazygit"
# Yazi file manager 
bind C-r display-popup \
  -d "#{pane_current_path}" \
  -w 90% \
  -h 90% \
  -E "yazi"
# Termianl window 
bind C-t display-popup \
  -d "#{pane_current_path}" \
  -w 75% \
  -h 75% \
  -E "zsh"
# ----------------------------------------------------------------------
# | Status bar                                                         |
# ----------------------------------------------------------------------

set -g status on

source-file $HOME/.config/tmux/themes/command_center/statusline/statusline.tmux


# ----------------------------------------------------------------------
# | Plugins                                                            |
# ----------------------------------------------------------------------

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'iarchean/tmux-starship'
#set -g @plugin '2kabhishek/tmux2k'
set -g @plugin 'YousefHadder/tmux-speedtest'
set -g @plugin 'jtmcginty/tmux-session-dots'
set -g @plugin 'jaclu/tmux-packet-loss'
set -g @plugin 'xamut/tmux-network-bandwidth'
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g @plugin "soyuka/tmux-current-pane-hostname"

run-shell ~/.config/tmux/plugins/tmux-speedtest/speedtest.tmux
run-shell ~/.config/tmux/plugins/tmux-mode-indicator/mode_indicator.tmux
run-shell ~/.config/tmux/plugins/tmux-prefix-highlight/prefix_highlight.tmux

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run ~/.config/tmux/plugins/tpm/tpm
