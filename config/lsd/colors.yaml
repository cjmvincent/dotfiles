---

# Morphin Time Color Palette
# Power Rangers inspired - mapped from VS Code theme
#
# Red Ranger:   #F14C4C / #cd3131
# Blue Ranger:  #2472c8 / #3b8eea
# Yellow Ranger:#F5F543 / #FEFF6E
# Green Ranger: #0dbc79 / #23d18b
# Pink Ranger:  #d670d6
# Black Ranger: #818181 / #454545

user: "#d670d6"
group: "#d670d6"
permission:
  read: "#0dbc79"
  write: "#F5F543"
  exec: "#F14C4C"
  exec-sticky: "#cd3131"
  no-access: "#454545"
  octal: "#3b8eea"
  acl: "#d670d6"
  context: "#d670d6"
date:
  hour-old: "#23d18b"
  day-old: "#0dbc79"
  older: "#818181"
size:
  none: "#454545"
  small: "#0dbc79"
  medium: "#F5F543"
  large: "#F14C4C"
inode:
  valid: "#3b8eea"
  invalid: "#454545"
links:
  valid: "#3b8eea"
  invalid: "#454545"
tree-edge: "#818181"
git-status:
  default: "#818181"
  unmodified: "#818181"
  ignored: "#454545"
  new-in-index: "#23d18b"
  new-in-workdir: "#0dbc79"
  typechange: "#F5F543"
  deleted: "#F14C4C"
  renamed: "#3b8eea"
  modified: "#F5F543"
  conflicted: "#cd3131"
filetype:
  dir:
    foreground: "#2472c8"